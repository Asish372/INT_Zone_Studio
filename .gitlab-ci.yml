stages:
  - lint
  - test
  - build

default:
  interruptible: true

python-lint:
  stage: lint
  image: python:3.10
  before_script:
    - pip install ruff
  script:
    - ruff check src desktop/engine_sidecar
  # Informational for now - tighten once the existing findings are cleaned up
  allow_failure: true

python-tests:
  stage: test
  image: python:3.10
  before_script:
    - pip install -r requirements.txt
  script:
    - pytest tests/ -q
  # Allow failure until the suite is verified green on shared runners
  allow_failure: true

studio-build:
  stage: build
  image: node:20
  cache:
    key: studio-npm
    paths:
      - desktop/studio/node_modules/
  script:
    - cd desktop/studio
    - npm ci
    - npm run build
  allow_failure: true
